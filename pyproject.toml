[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse-india"
version = "0.1.0"
description = "Daily intelligence and reporting for Indian stock markets."
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
