[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse-india"
version = "0.1.0"
description = "Daily intelligence and reporting for Indian stock markets."
requires-python = ">=3.13,<3.14"
dependencies = ["kotakneoapi==3.0.13", "certifi", "streamlit"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
